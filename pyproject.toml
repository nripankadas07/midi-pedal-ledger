[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "midi-pedal-ledger"
version = "0.1.0"
description = "Explain MIDI key release, CC64 sustain release and exact tempo-derived held-note intervals."
